name: cina-companion
services:
  companion:
    build: .
    restart: unless-stopped
    ports:
      - "${CINA_BIND_IP:-127.0.0.1}:${CINA_PORT:-8443}:8443"
    environment:
      CINA_NAME: ${CINA_NAME:-Home}
      CINA_CONTEXT: ${CINA_CONTEXT:-4096}
      OLLAMA_URL: http://model:11434
    volumes:
      - cina-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on: [model]
    stop_grace_period: 55s
  model:
    image: ${CINA_OLLAMA_IMAGE:-ollama/ollama:0.40.8@sha256:2b8eecdb85aa6ea67c381c8ecffec04b2658496cf2821a8f88b0485bdff198e8}
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: ${CINA_CONTEXT:-4096}
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - cina-models:/root/.ollama
    security_opt: [no-new-privileges:true]
volumes:
  cina-data:
  cina-models:
